# graph-bench's own CodSpeed project. Separate from grafeo's CodSpeed benchmarks, which it does not replace.
# Needs the CodSpeed app on graph-bench, codspeed-macro runners enabled for the org, and a CODSPEED_TOKEN repository secret.
#
# Both jobs measure grafeo `main`, built from source (graph-bench setup --grafeo grafeo), never the PyPI release.
#   codspeed: the push selection under CodSpeed in wall-time mode, on every push to main, daily and on demand.
#   readme:   the full selection with `graph-bench bench`, daily and on demand; it regenerates the README's
#             results section and opens a pull request on the branch bot/results.
name: Benchmarks

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  codspeed:
    name: CodSpeed (push selection)
    # Needs the CodSpeed app on graph-bench, codspeed-macro runners enabled for the org, and a CODSPEED_TOKEN repository secret.
    runs-on: codspeed-macro
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out grafeo main
        uses: actions/checkout@v7
        with:
          repository: GrafeoDB/grafeo
          ref: main
          path: grafeo
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: grafeo
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra embedded --extra bench
      - name: Build and install grafeo main
        run: uv run --no-sync graph-bench setup --grafeo grafeo
      - name: Dataset cache key
        id: data-key
        run: echo "key=$(uv run --no-sync graph-bench data key --selection push)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/graph-bench
          key: graph-bench-data-${{ steps.data-key.outputs.key }}
      - run: uv run --no-sync graph-bench data prepare --selection push
      - name: Benchmark plan
        run: uv run --no-sync graph-bench list --selection push
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: uv run --no-sync graph-bench codspeed --selection push --out out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-push
          path: out/results.json
          if-no-files-found: warn

  readme:
    name: README results (full selection)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Needs codspeed-macro runners enabled for the org (no CodSpeed upload, so no token).
    runs-on: codspeed-macro
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out grafeo main
        uses: actions/checkout@v7
        with:
          repository: GrafeoDB/grafeo
          ref: main
          path: grafeo
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: grafeo
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra embedded --extra bench
      - name: Build and install grafeo main
        run: uv run --no-sync graph-bench setup --grafeo grafeo
      - name: Dataset cache key
        id: data-key
        run: echo "key=$(uv run --no-sync graph-bench data key --selection full)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/graph-bench
          key: graph-bench-data-${{ steps.data-key.outputs.key }}
      - run: uv run --no-sync graph-bench data prepare --selection full
      - name: Benchmark plan
        run: uv run --no-sync graph-bench list --selection full
      - name: Run the benchmarks
        run: uv run --no-sync graph-bench bench --selection full --out out
      - name: Write the results section
        run: uv run --no-sync graph-bench report --format readme --in out/results.json --write README.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-full
          path: out/results.json
          if-no-files-found: warn
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/results
          title: Update benchmark results
          commit-message: Update benchmark results
          body: |
            The results section of README.md, regenerated by the scheduled `full` run
            (`graph-bench bench --selection full`) against grafeo `main` built from source.
            The run's results.json is attached to the workflow run as the artifact `results-full`.
          add-paths: README.md
          delete-branch: true
