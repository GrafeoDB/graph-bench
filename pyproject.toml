[project]
name = "graph-bench"
version = "0.3.0"
description = "Extensive benchmark suite for graph databases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["networkx>=3.0", "numpy>=1.25", "scipy>=1.11", "psutil>=5.9", "typer>=0.15.0"]
authors = [{ name = "S.T. Grond", email = "dev@grafeo.dev" }]
license = "Apache-2.0"
keywords = [
    "benchmark",
    "graph-database",
    "ladybug",
    "grafeo",
    "performance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://grafeo.dev/"
Repository = "https://github.com/GrafeoDB/graph-bench"

[project.optional-dependencies]
grafeo = ["grafeo>=0.6.0,<0.7"]
ladybug = ["real_ladybug>=0.15"]
embedded = ["graph-bench[grafeo,ladybug]"]
bench = ["pytest>=9.0.2", "pytest-codspeed>=4.0"]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0",
    "ruff>=0.15.0",
    "prek>=0.3.2",
    "ty>=0.0.15",
]

[project.scripts]
graph-bench = "graph_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_bench"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--cov=graph_bench --cov-report=term-missing --cov-fail-under=88"
testpaths = ["tests"]
markers = [
    "grafeo: requires Grafeo",
    "ladybug: requires LadybugDB",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["graph_bench"]
# The runner tests start the worker as a subprocess; measure it there too.
patch = ["subprocess"]
omit = ["*/__init__.py", "graph_bench/databases/grafeo.py", "graph_bench/databases/ladybug.py"]

[tool.coverage.report]
fail_under = 88
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.environment]
python-version = "3.12"
