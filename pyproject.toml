[project]
name = "graph-bench"
version = "0.3.0"
description = "Extensive benchmark suite for graph databases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["networkx>=3.0", "numpy>=1.25", "scipy>=1.11", "psutil>=5.9", "typer>=0.15.0"]
authors = [{ name = "S.T. Grond", email = "dev@grafeo.dev" }]
license = "Apache-2.0"
keywords = [
    "benchmark",
    "graph-database",
    "ladybug",
    "grafeo",
    "performance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://grafeo.dev/"
Repository = "https://github.com/GrafeoDB/graph-bench"

[project.optional-dependencies]
grafeo = ["grafeo>=0.6.0,<0.7"]
ladybug = ["ladybug>=0.22.1"]
neug = ["neug>=0.3.0"]
# The wheel is manylinux_2_38 only (glibc 2.38 or newer), so the extra is empty elsewhere.
falkordb = ["falkordblite>=0.11.0; sys_platform == 'linux'"]
# The wheel is Linux only (manylinux_2_35). pyarrow writes the Parquet files `LOAD PARQUET` reads and is not a
# turingdb dependency.
turingdb = ["turingdb>=3.0.2; sys_platform == 'linux'", "pyarrow>=15; sys_platform == 'linux'"]
# helix-db is the pure Python SDK (imported as helixdb); helix-db-embedded carries the native runtime and has wheels
# for Linux, Windows and macOS.
helixdb = ["helix-db>=0.3.4", "helix-db-embedded>=0.3.3"]
oxigraph = ["pyoxigraph>=0.5.13"]
embedded = ["graph-bench[grafeo,ladybug,neug,falkordb,turingdb,helixdb,oxigraph]"]
bench = ["pytest>=9.0.2", "pytest-codspeed>=5.0.3"]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0",
    "ruff>=0.15.0",
    "prek>=0.3.2",
    "ty>=0.0.15",
    "pytest-codspeed>=5.0.3",
]

[project.scripts]
graph-bench = "graph_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_bench"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["legacy", "docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--cov=graph_bench --cov-report=term-missing --cov-fail-under=88"
testpaths = ["tests"]
markers = [
    "grafeo: requires Grafeo",
    "ladybug: requires LadybugDB",
    "neug: requires NeuG",
    "falkordb: requires FalkorDB (falkordblite, Linux only)",
    "turingdb: requires TuringDB (Linux only)",
    "helixdb: requires HelixDB (helix-db and helix-db-embedded)",
    "oxigraph: requires Oxigraph (pyoxigraph)",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["graph_bench"]
# The runner tests start the worker as a subprocess; measure it there too.
patch = ["subprocess"]
omit = [
    "*/__init__.py",
    "graph_bench/databases/grafeo.py",
    "graph_bench/databases/ladybug.py",
    "graph_bench/databases/neug.py",
    "graph_bench/databases/falkordb.py",
    "graph_bench/databases/turingdb.py",
    "graph_bench/databases/helixdb.py",
    "graph_bench/databases/helix_queries.py",
]

[tool.coverage.report]
fail_under = 88
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.environment]
python-version = "3.12"
